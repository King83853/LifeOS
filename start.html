<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="background:#f3f4f6">
<script>
// Bootstrap entry point for the home-screen icon. Its only job is to make
// sure the service worker is actually controlling this page before handing
// off to index.html — on iOS, the very first navigation after a cold launch
// can race ahead of service worker startup and fall through to the network,
// which is what triggers the "No Internet Connection" flash even though the
// app is fully cached. Waiting here (instead of navigating straight to
// index.html) keeps that race out of the real app's navigation.
function go() { location.replace('index.html'); }
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
  if (navigator.serviceWorker.controller) {
    go();
  } else {
    navigator.serviceWorker.addEventListener('controllerchange', go);
    setTimeout(go, 800); // fallback if controllerchange never fires
  }
} else {
  go();
}
</script>
</body>
</html>
